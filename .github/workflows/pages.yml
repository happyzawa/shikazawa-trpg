name: Publish scenario list
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate and build public page
        run: |
          node --test scripts/build.test.mjs
          node scripts/build.mjs
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html .nojekyll favicon.svg favicon-32.png favicon.ico apple-touch-icon.png public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

